<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>[Nama Taman] — Prototaip Navigasi</title>
  <meta name="description" content="Prototaip navigasi laman web komuniti taman perumahan. Kandungan ialah placeholder.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#kandungan" data-skip>Langkau ke kandungan utama</a>

  <header class="site-header" id="site-header">
    <div class="wrap header-row">
      <a class="brand" href="#/" aria-label="[Nama Taman] — ke Laman Utama">
        <span class="brand-logo" aria-hidden="true">LOGO</span>
        <span class="brand-text">
          <span class="brand-name">[Nama Taman]</span>
          <span class="brand-sub">Persatuan Penduduk</span>
        </span>
      </a>
      <form class="hdr-search" role="search" data-search>
        <label for="hdr-q" class="visually-hidden">Cari dalam laman</label>
        <div class="search-row">
          <input id="hdr-q" type="search" placeholder="Cari: yuran, dewan, AGM…" autocomplete="off">
          <button type="submit" class="btn" data-icon="search">Cari</button>
        </div>
      </form>
      <div class="header-actions">
        <a class="hdr-btn hdr-cari" href="#/cari" data-icon="search">Cari</a>
        <button type="button" class="hdr-btn menu-btn" id="menu-btn" aria-expanded="false" aria-controls="drawer" data-icon="menu">Menu</button>
      </div>
    </div>
    <nav class="mainnav" id="mainnav" aria-label="Menu utama">
      <div class="wrap"><ul class="mainnav-list" id="mainnav-list"></ul></div>
    </nav>
  </header>

  <main id="kandungan" tabindex="-1"></main>

  <footer class="site-footer" id="site-footer"></footer>

  <div class="drawer" id="drawer" hidden>
    <div class="drawer-backdrop" data-close></div>
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="drawer-head">
        <h2 id="drawer-title" class="drawer-title">Menu</h2>
        <button type="button" class="hdr-btn" data-close data-icon="x">Tutup</button>
      </div>
      <nav aria-label="Menu utama (telefon)"><ul class="drawer-list" id="drawer-list"></ul></nav>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
